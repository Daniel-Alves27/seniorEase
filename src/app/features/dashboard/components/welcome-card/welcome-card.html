<app-card>
  <div card-content>
    <div class="flex flex-col gap-4">
      <span class="text-5xl"> </span>
      <div class="flex justify-between items-center">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="54"
          height="54"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-smile-icon lucide-smile"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="M8 14s1.5 2 4 2 4-2 4-2" />
          <line x1="9" x2="9.01" y1="9" y2="9" />
          <line x1="15" x2="15.01" y1="9" y2="9" />
        </svg>
        <app-header></app-header>
      </div>
      <div>
        <h1 class="text-3xl font-bold text-slate-800">
          Olá,
          {{ user()?.name || 'Usuário' }}!
        </h1>

        <p class="text-xl text-slate-600 mt-2">
          {{ greeting() }}
        </p>
      </div>

      <div>
        <p class="text-lg text-slate-500">Hoje é</p>

        <p class="text-xl font-semibold">
          {{ today | date: "EEEE, dd 'de' MMMM 'de' yyyy" : '' : 'pt-BR' }}
        </p>
      </div>

      <div class="rounded-xl bg-green-50 border border-green-200 p-4">
        <p class="text-green-800 text-lg">💚 Esperamos que você tenha um ótimo dia!</p>
      </div>
    </div>
  </div>
</app-card>
