<button
  type="button"
  (click)="action.emit()"
  class="w-full rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition hover:shadow-md focus:outline-none focus:ring-4 focus:ring-blue-300"
>
  <div class="flex flex-col items-center gap-3">
    <span class="text-5xl">
      {{ icon() }}
    </span>

    <span class="text-lg font-semibold text-slate-700 text-center">
      {{ title() }}
    </span>
  </div>
</button>
