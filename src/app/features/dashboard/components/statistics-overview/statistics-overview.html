<div class="grid gap-6 md:grid-cols-2 xl:grid-cols-4">
  <app-stat-card icon="📋" title="Total" [value]="statistics.totalTasks()" />

  <app-stat-card icon="✅" title="Concluídas" [value]="statistics.completedTasks()" />

  <app-stat-card icon="⏳" title="Pendentes" [value]="statistics.pendingTasks()" />

  <app-stat-card icon="📈" title="Conclusão" [value]="statistics.completionRate() + '%'" />
</div>
