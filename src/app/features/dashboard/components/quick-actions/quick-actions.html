<app-card>
  <div card-header class="flex gap-1">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="34"
      height="34"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="lucide lucide-rocket-icon lucide-rocket"
    >
      <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" />
      <path
        d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09"
      />
      <path
        d="M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z"
      />
      <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05" />
    </svg>
    <h2 class="text-2xl font-bold">Ações rápidas</h2>
  </div>

  <div card-content>
    <div class="grid grid-cols-2 gap-4">
      <app-action-card icon="➕" title="Nova tarefa" (action)="goToTasks()"> </app-action-card>

      <app-action-card icon="👤" title="Meu perfil" (action)="goToProfile()"> </app-action-card>

      <app-action-card icon="⚙️" title="Configurações" (action)="goToSettings()"> </app-action-card>

      <app-action-card icon="📜" title="Histórico" (action)="goToHistory()"> </app-action-card>
    </div>
  </div>
</app-card>
