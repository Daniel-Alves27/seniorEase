<div class="bg-register min-h-screen flex items-center justify-center bg-red-400 p-6">
  <div class="w-full max-w-md">
    <app-card>
      <div card-header>
        <h1 class="text-3xl font-bold text-center">SeniorEase</h1>

        <p class="text-center text-gray-500 mt-2">Crie sua conta</p>
      </div>

      <div card-content>
        <form [formGroup]="registerForm" (ngSubmit)="submit()" class="flex flex-col gap-4">
          <app-input label="Nome" placeholder="Digite seu nome" formControlName="name"> </app-input>

          <app-input
            label="Email"
            placeholder="Digite seu email"
            type="email"
            formControlName="email"
          >
          </app-input>

          <app-input
            label="Senha"
            type="password"
            placeholder="Digite sua senha"
            formControlName="password"
          >
          </app-input>

          @if (errorMessage()) {
            <div class="text-red-600 text-sm text-center">
              {{ errorMessage() }}
            </div>
          }

          <app-button label="Criar conta" type="submit" [loading]="loading()"> </app-button>
        </form>
      </div>
    </app-card>
  </div>
</div>
