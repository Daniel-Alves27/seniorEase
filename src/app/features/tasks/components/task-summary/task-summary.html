<app-card>
  <div card-header class="flex gap-1">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="34"
      height="34"
      viewBox="0 0 24 24"
      fill="none"
      stroke="#000000"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="lucide lucide-clipboard-list-icon lucide-clipboard-list"
    >
      <rect width="8" height="4" x="8" y="2" rx="1" ry="1" />
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
      <path d="M12 11h4" />
      <path d="M12 16h4" />
      <path d="M8 11h.01" />
      <path d="M8 16h.01" />
    </svg>
    <h2 class="text-2xl font-bold">Resumo das tarefas</h2>
  </div>

  <div card-content>
    <div class="space-y-3">
      <div class="flex justify-between items-center text-lg">
        <span>Total</span>

        <strong>
          {{ taskStore.total() }}
        </strong>
      </div>

      <div class="flex justify-between items-center text-lg">
        <span>Pendentes</span>

        <strong class="text-amber-600">
          {{ taskStore.pendingCount() }}
        </strong>
      </div>

      <div class="flex justify-between items-center text-lg">
        <span>Concluídas</span>

        <strong class="text-green-600">
          {{ taskStore.completedCount() }}
        </strong>
      </div>
    </div>
  </div>
</app-card>
