<app-dialog [opened]="opened()" title="Excluir tarefa" (closed)="cancel.emit()">
  <div class="space-y-4 text-center">
    <div class="text-6xl">🗑️</div>

    <p>Tem certeza que deseja excluir esta tarefa?</p>

    <p class="text-red-600 font-medium">Essa ação não poderá ser desfeita.</p>

    <div class="flex justify-center gap-2">
      <app-button label="Cancelar" (click)="cancel.emit()"> </app-button>

      <app-button label="Excluir" variant="danger" (click)="confirm.emit()"> </app-button>
    </div>
  </div>
</app-dialog>
