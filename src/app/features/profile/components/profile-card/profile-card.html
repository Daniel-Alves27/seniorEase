<app-card>
  <div card-content class="space-y-8">
    <button
      type="button"
      class="flex items-center text-blue-600 hover:text-blue-700"
      (click)="goBack()"
    >
      ← Voltar ao Dashboard
    </button>
    <div class="text-center">
      <div
        class="mx-auto mb-2 flex h-18 w-18 items-center justify-center rounded-full bg-blue-600 text-5xl font-bold text-white"
      >
        {{ initial() }}
      </div>

      <h2 class="text-3xl font-bold">Meu Perfil</h2>
    </div>

    <form [formGroup]="form" (ngSubmit)="save()" class="grid gap-1.5">
      <app-input label="Nome" formControlName="name"> </app-input>

      <app-input label="E-mail" formControlName="email"> </app-input>

      <div>
        <p class="text-sm text-slate-500 pt-1">Membro desde</p>

        <p class="font-semibold pb-1">
          {{ user()?.createdAt | date: 'dd/MM/yyyy HH:mm' }}
        </p>
      </div>

      <app-button label="Salvar" type="submit"></app-button>
    </form>
  </div>
</app-card>
