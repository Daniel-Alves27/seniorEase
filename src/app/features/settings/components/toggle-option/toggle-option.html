<label
  class="flex cursor-pointer items-center justify-between rounded-xl border p-4 transition hover:bg-slate-50"
>
  <span class="text-lg">
    {{ label() }}
  </span>

  <input
    type="checkbox"
    class="h-5 w-5"
    [checked]="checked()"
    (change)="changed.emit(!checked())"
  />
</label>
